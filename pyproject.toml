[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-reliable-ai-lab"
version = "0.1.0"
description = "Ten local-first, reproducible AI reliability experiments"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Karthik Coimbatore Varadaraj"}]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
reliable-ai = "reliable_ai_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["reliable_ai_lab*"]

[tool.setuptools.package-data]
reliable_ai_lab = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
