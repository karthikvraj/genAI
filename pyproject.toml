[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-reliable-ai-lab"
version = "0.2.0"
description = "Reliability engineering toolkit for LLMs, RAG, AI agents, model drift, GPU telemetry and inference systems"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Karthik Coimbatore Varadaraj"}]
keywords = [
  "artificial-intelligence",
  "machine-learning",
  "reliable-ai",
  "responsible-ai",
  "llm",
  "llm-evaluation",
  "rag",
  "retrieval-augmented-generation",
  "agentic-ai",
  "ai-agents",
  "ai-evaluation",
  "model-drift",
  "mlops",
  "ai-observability",
  "gpu",
  "inference",
  "reliability-engineering",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Monitoring",
]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2"]

[project.urls]
Homepage = "https://github.com/karthikvraj/reliable-ai-lab"
Repository = "https://github.com/karthikvraj/reliable-ai-lab"
Issues = "https://github.com/karthikvraj/reliable-ai-lab/issues"
Changelog = "https://github.com/karthikvraj/reliable-ai-lab/blob/main/docs/RELEASE_NOTES.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
reliable-ai = "reliable_ai_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["reliable_ai_lab*"]

[tool.setuptools.package-data]
reliable_ai_lab = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
