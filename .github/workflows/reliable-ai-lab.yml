name: Reliable AI Lab
on:
  push:
    branches: [main, 'maintenance/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reliable-ai-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest --junitxml=docs/test-results.xml\n      - run: python -m reliable_ai_lab benchmark --output docs/benchmark-results.json
      - run: python -m build --wheel
      - run: python scripts/package.py
      - run: python scripts/check_downloads.py
      - uses: actions/upload-artifact@v4
        with:
          name: reliable-ai-lab-${{ matrix.python }}
          path: |
            dist/*
            docs/test-results.xml
            docs/standalone-test-results.json\n            docs/benchmark-results.json
          if-no-files-found: error
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: reliable-ai-lab-3.12
          path: release-build
      - name: Publish a new version without replacing earlier downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^__version__ = "\([0-9.]*\)"$/\1/p' reliable_ai_lab/__init__.py)
          test -n "$version"
          tag="reliable-ai-lab-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its assets unchanged."
          else
            gh release create "$tag" release-build/dist/* --target "$COMMIT" --title "Reliable AI Lab v${version}" --notes-file docs/RELEASE_NOTES.md
          fi
