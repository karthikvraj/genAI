# Copy this file into .github/workflows/ in a downstream repository.
# At this location it is an inert example and does not run in this repository.
name: Reliable AI Lab example

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliability-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Reliable AI Lab v0.2.1 from its source tag
        run: python -m pip install "git+https://github.com/karthikvraj/reliable-ai-lab.git@reliable-ai-lab-v0.2.1"
      - name: Run a deterministic synthetic check
        run: python -m reliable_ai_lab demo evidence-gate --output reliable-ai-lab-result.json
      - name: Upload the JSON result
        uses: actions/upload-artifact@v4
        with:
          name: reliable-ai-lab-result
          path: reliable-ai-lab-result.json
          if-no-files-found: error
          retention-days: 7
      # This synthetic demo intentionally returns review_required.
      # Leave RUN_REVIEW_GATE unset to upload only; set it to any non-empty
      # value after choosing a project-specific policy. This is not universal.
      - name: Apply downstream review policy (optional)
        if: ${{ vars.RUN_REVIEW_GATE }}
        run: |
          python - << "PY"
          import json
          from pathlib import Path

          result = json.loads(Path("reliable-ai-lab-result.json").read_text(encoding="utf-8"))
          if result["decision"] == "review_required":
              raise SystemExit("The configured downstream policy requires review")
          PY
